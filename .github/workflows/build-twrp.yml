name: Build TWRP - nevada

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (user/userdebug/eng)"
        required: true
        default: "eng"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-8-jdk

      - name: Set up git identity
        run: |
          git config --global user.name "crabcakes97"
          git config --global user.email "eddiebob146@gmail.com"
          git config --global color.ui false

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Checkout this device tree into the source tree
        uses: actions/checkout@v4
        with:
          path: twrp/device/motorola/nevada

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MotorolaMobilityLLC/kernel-mtk
          path: twrp/kernel/motorola/nevada

      - name: Build TWRP (packed into vendor_boot on this GKI device)
        working-directory: twrp
        run: |
          set -e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_nevada-${{ github.event.inputs.variant }}
          # This device sets TARGET_NO_RECOVERY + BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT,
          # so TWRP's ramdisk is packed into vendor_boot.img, not a standalone recovery.img.
          # "mka recoveryimage" would build nothing useful here.
          mka vendorbootimage -j"$(nproc)"

      - name: Locate output image
        working-directory: twrp
        run: |
          OUT_DIR="out/target/product/nevada"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          ls -la "$OUT_DIR" | grep -Ei 'vendor_boot|boot|dtbo' || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-nevada-vendor_boot-${{ github.run_number }}
          path: |
            twrp/${{ env.OUT_DIR }}/vendor_boot.img
          if-no-files-found: warn
          retention-days: 14
